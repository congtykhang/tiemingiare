<script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            const navLinks = document.getElementById('nav-links');
            mobileMenu.addEventListener('click', function() {
                navLinks.classList.toggle('active');
                mobileMenu.classList.toggle('is-active');
            });
            const dropBtn = document.querySelector('.dropbtn');
            const dropdownContent = document.querySelector('.dropdown-content');
            dropBtn.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    dropdownContent.classList.toggle('show');
                }
            });
        });

        // Bỏ chế độ tự động làm tròn khi khách gõ số lẻ để chạy chiến thuật sale
        document.getElementById('priceCalcForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const material = document.getElementById('calcMaterial').value;
            const length = document.getElementById('calcLength').value;
            const width = document.getElementById('calcWidth').value;
            const lamination = document.getElementById('calcLamination').value;
            const originalQty = parseInt(document.getElementById('calcQty').value); // Lấy chính xác số khách nhập
            
            const btn = document.getElementById('btnCalculate');
            const resultContainer = document.getElementById('resultContainer');
            const qtyWarning = document.getElementById('qtyWarning');
            const resultFast = document.getElementById('resultFast');
            const resultOffset = document.getElementById('resultOffset');
            
            const fastUnitPriceEl = document.getElementById('fastUnitPrice');
            const fastTotalPriceEl = document.getElementById('fastTotalPrice');
            const offsetUnitPriceEl = document.getElementById('offsetUnitPrice');
            const offsetTotalPriceEl = document.getElementById('offsetTotalPrice');

            btn.innerHTML = '⏳ ĐANG PHÂN TÍCH GIÁ...';
            btn.disabled = true;
            resultContainer.style.display = 'none';
            qtyWarning.style.display = 'none'; // Ẩn thông báo cũ

            // LINK GOOGLE APPS SCRIPT ĐÃ GẮN CỨNG
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzKf0GxuGQ_otWr8xkvyKOPR_LVxc4eOTK-BZNror7XwT841-WJNXfNZYg5_YgEwWP/exec";
            
            try {
                const payload = {
                    chatlieu: material,
                    dai: parseFloat(length),
                    rong: parseFloat(width),
                    canmang: lamination,
                    soluong: originalQty
                };

                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    let hasFast = false;
                    let hasOffset = false;
                    let currentBestPrice = 0;

                    // 1. HIỂN THỊ KẾT QUẢ CHO SỐ LƯỢNG KHÁCH NHẬP
                    if (data.tongTienOffset !== undefined && data.tongTienOffset > 0) {
                        const unitPrice = Math.round(data.tongTienOffset / originalQty);
                        offsetUnitPriceEl.innerHTML = unitPrice.toLocaleString('vi-VN') + ' đ<span style="font-size:14px; font-weight:normal; color:#64748b;">/tem</span>';
                        offsetTotalPriceEl.innerHTML = 'Tổng: <strong>' + data.tongTienOffset.toLocaleString('vi-VN') + ' đ</strong>';
                        resultOffset.style.display = 'block';
                        hasOffset = true;
                        currentBestPrice = data.tongTienOffset;
                    } else {
                        resultOffset.style.display = 'none';
                    }

                    if (data.tongTienFast !== undefined && data.tongTienFast > 0) {
                        const unitPrice = Math.round(data.tongTienFast / originalQty);
                        fastUnitPriceEl.innerHTML = unitPrice.toLocaleString('vi-VN') + ' đ<span style="font-size:14px; font-weight:normal; color:#64748b;">/tem</span>';
                        fastTotalPriceEl.innerHTML = 'Tổng: <strong>' + data.tongTienFast.toLocaleString('vi-VN') + ' đ</strong>';
                        resultFast.style.display = 'block';
                        hasFast = true;
                        
                        // Lấy giá tốt nhất hiện tại khách phải trả
                        if(currentBestPrice === 0 || data.tongTienFast < currentBestPrice) {
                            currentBestPrice = data.tongTienFast;
                        }
                    } else {
                        resultFast.style.display = 'none';
                    }

                    // 2. CHIẾN THUẬT SALE TÂM LÝ (NẾU KHÁCH NHẬP LẺ)
                    if (originalQty !== data.nextQty && data.tongTienOffsetNext > 0) {
                        const nextQty = data.nextQty;
                        const nextTotal = data.tongTienOffsetNext;
                        const extraTem = nextQty - originalQty;

                        if (nextTotal <= currentBestPrice) {
                            // KỊCH BẢN ĐẶC QUYỀN (Mua nhiều nhưng rẻ hơn hoặc bằng)
                            qtyWarning.innerHTML = `🎉 <b>ĐẶC QUYỀN MIỄN PHÍ:</b> Đơn hàng của bạn đủ điều kiện nâng cấp! Xưởng sẽ tự động in dư thành <b>${nextQty} tem</b> (tặng thêm ${extraTem} tem) với giá Tiết Kiệm chỉ <b>${nextTotal.toLocaleString('vi-VN')}đ</b>.`;
                            qtyWarning.style.background = "#f0fdf4";
                            qtyWarning.style.color = "#166534";
                            qtyWarning.style.borderColor = "#bbf7d0";
                            qtyWarning.style.display = 'block';
                        } else if ((nextTotal - currentBestPrice) <= 100000) { 
                            // KỊCH BẢN MẸO TIẾT KIỆM (Thêm tí tiền được mớ tem)
                            const diff = nextTotal - currentBestPrice;
                            qtyWarning.innerHTML = `💡 <b>MẸO TIẾT KIỆM:</b> Chỉ cần thêm <b>${diff.toLocaleString('vi-VN')}đ</b>, bạn sẽ nhận được tới <b>${nextQty} tem</b> (gấp nhiều lần) nhờ công nghệ In Tiết Kiệm. Cân nhắc nhé!`;
                            qtyWarning.style.background = "#fffbeb";
                            qtyWarning.style.color = "#b45309";
                            qtyWarning.style.borderColor = "#fde68a";
                            qtyWarning.style.display = 'block';
                        }
                    }
                    
                    resultContainer.style.display = 'block';

                } else {
                    alert('Lỗi hệ thống: ' + data.error);
                }
            } catch (error) {
                alert('Chưa kết nối được máy chủ');
            } finally {
                btn.innerHTML = 'XEM GIÁ ƯỚC TÍNH';
                btn.disabled = false;
            }
        });
    </script>
