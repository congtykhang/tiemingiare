    <link rel="stylesheet" href="style.css">
    <style>
        /* =========================================
           BỐ CỤC CHIA 2 CỘT CHO MÀN HÌNH MÁY TÍNH
           ========================================= */
        .content-wrapper {
            position: relative;
            max-width: 1150px;
            margin: 50px auto 60px; 
            padding: 0 15px;
            z-index: 10;
        }

        .main-split-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start; 
        }

        /* CỘT TRÁI: BẢNG TÍNH GIÁ (STICKY) */
        .calc-col {
            flex: 0 0 460px;
            position: sticky;
            top: 100px; 
            z-index: 10;
        }

        .calculator-box {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            border-top: 5px solid var(--accent-gold, #fbbf24);
            padding: 30px 30px;
        }

        /* CỘT PHẢI: DANH SÁCH SẢN PHẨM */
        .products-col {
            flex: 1; 
            padding-top: 0; 
        }

        .products-header-title {
            font-size: 24px;
            color: #1e293b;
            margin-top: 0; 
            margin-bottom: 25px;
            font-weight: 800;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* THIẾT KẾ THẺ SẢN PHẨM */
        .pro-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #f1f5f9;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .pro-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #cbd5e1;
        }
        .pro-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .pro-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .pro-content h3 {
            margin: 0 0 10px 0;
            color: #0f172a;
            font-size: 16px;
            font-weight: 800;
        }
        .pro-content p {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            flex: 1;
            margin: 0 0 15px 0;
        }
        .btn-select-pro {
            display: block;
            text-align: center;
            background: #f8fafc;
            color: #3b82f6;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .btn-select-pro:hover {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        /* CSS BÊN TRONG FORM TÍNH GIÁ */
        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-weight: 700;
            font-size: 13px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px !important; 
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            background: #f8fafc;
            color: #0f172a;
        }
        
        .form-input:focus {
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* KHỐI KẾT QUẢ */
        #resultContainer {
            display: none;
            margin-top: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            background: #fff;
        }
        
        .result-header {
            background: #f8fafc; color: #1e293b; padding: 15px;
            text-align: center; font-weight: 800; font-size: 15px;
            border-bottom: 1px dashed #cbd5e1; text-transform: uppercase;
        }

        .result-comparison { display: flex; background: #fff; gap: 1px; }
        .result-box { flex: 1; padding: 25px 15px; text-align: center; display: none; }
        .price-big { font-size: 26px; font-weight: 900; margin: 8px 0; }
        .price-total { color: #0f172a; font-size: 15px; margin-bottom: 20px; }
        
        .btn-chot-don {
            display: block; padding: 12px; border-radius: 8px;
            text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s;
        }

        .box-fast .title { color: #166534; font-weight: bold; }
        .box-fast .price-big { color: #15803d; }
        .box-fast .btn-chot-don { background: #f0fdf4; border: 1px solid #166534; color: #166534; }
        .box-fast .btn-chot-don:hover { background: #166534; color: #fff; }

        .box-offset .title { color: #1e3a8a; font-weight: bold; }
        .box-offset .price-big { color: #1d4ed8; }
        .box-offset .btn-chot-don { background: #eff6ff; border: 1px solid #1e3a8a; color: #1e3a8a; }
        .box-offset .btn-chot-don:hover { background: #1e3a8a; color: #fff; }

        .qty-warning {
            font-size: 14px; line-height: 1.6; padding: 20px;
            text-align: center; display: none; border-top: 1px dashed #e2e8f0;
        }

        .btn-main-calc {
            background: var(--accent-gold, #fbbf24); color: #000; 
            padding: 15px 40px; border: none; border-radius: 50px;
            font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s; 
            width: 100%; box-shadow: 0 6px 15px rgba(251, 191, 36, 0.3); text-transform: uppercase; 
        }
        .btn-main-calc:hover:not(:disabled) {
            transform: translateY(-2px); box-shadow: 0 8px 20px rgba(251, 191, 36, 0.4);
        }

        /* RESPONSIVE */
        @media (max-width: 992px) {
            .content-wrapper { margin-top: 40px; }
