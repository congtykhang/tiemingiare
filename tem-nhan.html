<script>
        // Xử lý Menu Mobile
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            const navLinks = document.getElementById('nav-links');
            mobileMenu.addEventListener('click', function() {
                navLinks.classList.toggle('active');
                mobileMenu.classList.toggle('is-active');
            });
            const dropBtn = document.querySelector('.dropbtn');
            const dropdownContent = document.querySelector('.dropdown-content');
            dropBtn.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    dropdownContent.classList.toggle('show');
                }
            });
        });

        // Hàm làm tròn số lượng lên chẵn trăm
        function roundUpToHundred(num) {
            if (num % 100 === 0) return num;
            return Math.ceil(num / 100) * 100;
        }

        // Xử lý Báo giá tự động
        document.getElementById('priceCalcForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Lấy dữ liệu khách nhập
            const material = document.getElementById('calcMaterial').value;
            const length = document.getElementById('calcLength').value;
            const width = document.getElementById('calcWidth').value;
            const lamination = document.getElementById('calcLamination').value;
            const originalQty = parseInt(document.getElementById('calcQty').value);
            
            // Làm tròn số lượng
            const qty = roundUpToHundred(originalQty);
            
            const btn = document.getElementById('btnCalculate');
            const qtyWarning = document.getElementById('qtyWarning');
            const resultFast = document.getElementById('resultFast');
            const resultOffset = document.getElementById('resultOffset');
            
            const fastUnitPriceEl = document.getElementById('fastUnitPrice');
            const fastTotalPriceEl = document.getElementById('fastTotalPrice');
            const offsetUnitPriceEl = document.getElementById('offsetUnitPrice');
            const offsetTotalPriceEl = document.getElementById('offsetTotalPrice');

            // Đổi trạng thái nút bấm
            btn.innerHTML = '⏳ ĐANG TÍNH TOÁN...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            // Xử lý cảnh báo số lượng
            if (originalQty !== qty) {
                qtyWarning.innerText = `* Do quy cách máy in, số lượng ${originalQty} của bạn đã được làm tròn thành ${qty} tem.`;
                qtyWarning.style.display = 'block';
            } else {
                qtyWarning.style.display = 'none';
            }

            // ==============================================================
            // ⚠️ DÁN LINK GOOGLE SCRIPT CỦA ANH VÀO ĐÂY (NẰM GIỮA 2 DẤU "")
            // ==============================================================
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhIjo50yr8mh9W7GY4D9BEE1AH97sCEQDz05wrPGIb9uYXo8IPHn4CDR9b5WtkhfHK/exec";
            
            // Tự động dọn dẹp khoảng trắng dư thừa nếu anh lỡ copy dư
            const cleanUrl = GOOGLE_SCRIPT_URL.trim();

            // Cảnh báo ngay nếu anh dán sai loại link
            if (!cleanUrl.includes("script.google.com/macros/s/") || !cleanUrl.endsWith("/exec")) {
                alert("Đường link API anh dán chưa đúng chuẩn! Link bắt buộc phải chứa 'macros/s/' và đuôi là '/exec'. Anh kiểm tra lại nhé!");
                btn.innerHTML = 'XEM GIÁ ƯỚC TÍNH';
                btn.disabled = false;
                btn.style.opacity = '1';
                return;
            }

            try {
                const payload = {
                    chatlieu: material,
                    dai: parseFloat(length),
                    rong: parseFloat(width),
                    canmang: lamination,
                    soluong: parseInt(qty)
                };

                // Lệnh gọi fetch đơn giản nhất để vượt qua tường lửa CORS
                const response = await fetch(cleanUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    let hasFast = false;
                    let hasOffset = false;

                    // Nếu có giá Offset
                    if (data.tongTienOffset && data.tongTienOffset > 0) {
                        offsetUnitPriceEl.innerText = data.donGiaOffset.toLocaleString('vi-VN') + ' đ/tem';
                        offsetTotalPriceEl.innerText = 'Tổng tiền: ' + data.tongTienOffset.toLocaleString('vi-VN') + ' đ';
                        resultOffset.style.display = 'block';
                        hasOffset = true;
                    } else {
                        resultOffset.style.display = 'none';
                    }

                    // Nếu có giá Fast
                    if (data.tongTienFast && data.tongTienFast > 0) {
                        fastUnitPriceEl.innerText = data.donGiaFast.toLocaleString('vi-VN') + ' đ/tem';
                        fastTotalPriceEl.innerText = 'Tổng tiền: ' + data.tongTienFast.toLocaleString('vi-VN') + ' đ';
                        resultFast.style.display = 'block';
                        hasFast = true;
                    } else {
                        resultFast.style.display = 'none';
                    }
                    
                    if(!hasFast && !hasOffset) {
                         alert("Không thể tính giá với kích thước và số lượng này, vui lòng liên hệ Zalo!");
                    }

                } else {
                    alert('Lỗi hệ thống báo giá: ' + data.error);
                }
            } catch (error) {
                alert('Mạng chập chờn hoặc link API bị chặn: ' + error);
            } finally {
                btn.innerHTML = 'XEM GIÁ ƯỚC TÍNH';
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        });
    </script>
